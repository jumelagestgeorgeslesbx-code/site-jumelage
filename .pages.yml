# Interface d'édition du site (Pages CMS : https://app.pagescms.org)
# Chaque entrée de « content » est une rubrique du menu de gauche.
# Les champs anglais sont facultatifs : s'ils sont vides, le site affiche le texte français.

media:
  input: images
  output: images
  categories: [image]
  rename: safe

content:
  # ───────────────────────── AGENDA ─────────────────────────
  - name: agenda
    label: "📅 Agenda"
    type: file
    path: content/agenda.json
    format: json
    fields:
      - name: evenements
        label: Rendez-vous
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titre_fr} — {date}"
        fields:
          - name: titre_fr
            label: Titre
            description: "Ex. : Assemblée générale, Soirée crêpes, Voyage à Denmead"
            type: string
            required: true
            options:
              maxlength: 80
          - name: date
            label: Date
            description: "Date du rendez-vous. Si la date exacte n'est pas encore connue, choisissez le 1er du mois et remplissez « Date approximative » juste en dessous."
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: date_approx_fr
            label: Date approximative (facultatif)
            description: "Texte affiché à la place de la date exacte. Ex. : « Mai 2027 », « Du 12 au 15 mai ». Laissez vide pour afficher la date exacte."
            type: string
          - name: lieu
            label: Lieu
            type: select
            default: saint-georges
            options:
              values:
                - name: saint-georges
                  label: Saint-Georges
                - name: denmead
                  label: Denmead
                - name: autre
                  label: Autre lieu
          - name: description_fr
            label: Description
            description: "Quelques phrases : programme, heure, lieu précis, prix, comment s'inscrire…"
            type: text
          - name: photo
            label: Photo (facultatif)
            description: "Une image pour illustrer le rendez-vous (affiche, photo de l'an dernier…)."
            type: image
          - name: titre_en
            label: "Titre en anglais (facultatif)"
            description: "Laissez vide si vous ne savez pas : le titre français sera affiché aux visiteurs anglais."
            type: string
          - name: date_approx_en
            label: "Date approximative en anglais (facultatif)"
            description: "Ex. : « May 2027 »."
            type: string
          - name: description_en
            label: "Description en anglais (facultatif)"
            type: text

  # ───────────────────────── GALERIE ─────────────────────────
  - name: galerie
    label: "📷 Photos"
    type: file
    path: content/galerie.json
    format: json
    fields:
      - name: photos
        label: Photos de la galerie
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{legende_fr} {annee}"
        fields:
          - name: image
            label: Photo
            type: image
            required: true
          - name: legende_fr
            label: Légende
            description: "Ex. : Accueil des familles de Denmead"
            type: string
            options:
              maxlength: 100
          - name: annee
            label: Année (facultatif)
            type: string
            options:
              maxlength: 4
          - name: legende_en
            label: "Légende en anglais (facultatif)"
            type: string

  # ───────────────────────── ADHÉSION ─────────────────────────
  - name: adhesion
    label: "🤝 Adhésion et tarifs"
    type: file
    path: content/adhesion.json
    format: json
    fields:
      - name: tarifs
        label: Tarifs des cotisations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{libelle_fr} : {prix}"
        fields:
          - name: libelle_fr
            label: Nom du tarif
            type: string
            required: true
          - name: prix
            label: Prix
            description: "Ex. : 15 €"
            type: string
          - name: libelle_en
            label: "Nom du tarif en anglais (facultatif)"
            type: string
      - name: texte_fr
        label: Phrase d'introduction
        description: "Affichée au-dessus des tarifs."
        type: text
      - name: modalites_fr
        label: Comment payer
        description: "Ex. : chèque à l'ordre du comité, espèces lors des permanences…"
        type: text
      - name: lien_paiement
        label: Lien d'adhésion en ligne (facultatif)
        description: "Si le comité utilise HelloAsso ou un service similaire, collez ici l'adresse de la page d'adhésion (elle commence par https://). Un bouton « Adhérer en ligne » apparaîtra sur le site."
        type: string
      - name: texte_en
        label: "Phrase d'introduction en anglais (facultatif)"
        type: text
      - name: modalites_en
        label: "Comment payer, en anglais (facultatif)"
        type: text

  # ───────────────────────── PRÉSENTATION & CONTACT ─────────────────────────
  - name: general
    label: "🏠 Présentation et contact"
    type: file
    path: content/general.json
    format: json
    fields:
      - name: accroche_fr
        label: Phrase d'accueil
        description: "La phrase en haut de la page d'accueil, sous le nom des deux villages."
        type: text
      - name: presentation_fr
        label: Présentation du comité
        description: "Laissez une ligne vide entre deux paragraphes."
        type: text
      - name: annee_jumelage
        label: Année de signature du jumelage
        description: "Ex. : 1998. Laissez vide pour ne pas l'afficher."
        type: string
      - name: presidence
        label: Président(e) du comité
        description: "Prénom et nom. Laissez vide pour ne pas l'afficher."
        type: string
      - name: echanges_fr
        label: Rythme des échanges
        description: "Ex. : Un voyage par an, en alternance"
        type: string
      - name: traversee_fr
        label: Moyen de traversée
        description: "Ex. : Ferry Caen – Portsmouth"
        type: string
      - name: email
        label: Adresse e-mail du comité
        description: "Affichée sur le site. Les demandes d'adhésion y sont aussi envoyées."
        type: string
      - name: telephone
        label: Téléphone (facultatif)
        type: string
      - name: adresse
        label: Adresse postale
        type: text
      - name: facebook
        label: Page Facebook (facultatif)
        description: "Adresse complète, commençant par https://"
        type: string
      - name: site_denmead
        label: Site du comité de Denmead (facultatif)
        description: "Adresse complète, commençant par https://"
        type: string
      - name: accroche_en
        label: "Phrase d'accueil en anglais (facultatif)"
        type: text
      - name: presentation_en
        label: "Présentation en anglais (facultatif)"
        type: text
      - name: echanges_en
        label: "Rythme des échanges en anglais (facultatif)"
        type: string
      - name: traversee_en
        label: "Moyen de traversée en anglais (facultatif)"
        type: string

  # ───────────────────────── COMMUNES ─────────────────────────
  - name: communes
    label: "🗺️ Nos communes"
    type: file
    path: content/communes.json
    format: json
    fields:
      - name: saint_georges
        label: Saint-Georges-lès-Baillargeaux
        type: object
        fields:
          - name: description_fr
            label: Description
            type: text
          - name: points
            label: Points clés
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fr}"
            fields:
              - name: fr
                label: Texte
                type: string
              - name: en
                label: "Texte en anglais (facultatif)"
                type: string
          - name: photo
            label: Photo (facultatif)
            type: image
          - name: description_en
            label: "Description en anglais (facultatif)"
            type: text
      - name: denmead
        label: Denmead
        type: object
        fields:
          - name: description_fr
            label: Description
            type: text
          - name: points
            label: Points clés
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fr}"
            fields:
              - name: fr
                label: Texte
                type: string
              - name: en
                label: "Texte en anglais (facultatif)"
                type: string
          - name: photo
            label: Photo (facultatif)
            type: image
          - name: description_en
            label: "Description en anglais (facultatif)"
            type: text
